# @fileoverview Checks package tests, formatting, and release contents in CI.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / Prettier ${{ matrix.prettier }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.x
          - 22.x
          - 24.x
        prettier:
          - lockfile
          - latest-3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install latest Prettier 3.x
        if: matrix.prettier == 'latest-3'
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/prettier-latest" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            prettier@^3
          mv node_modules/prettier "$RUNNER_TEMP/prettier-lockfile"
          cp -R "$RUNNER_TEMP/prettier-latest/node_modules/prettier" node_modules/prettier
          node --input-type=module -e "import prettier from 'prettier'; console.log('Testing Prettier ' + prettier.version + '.')"

      - name: Run release checks
        if: matrix.node == '20.x' && matrix.prettier == 'lockfile'
        run: npm run check:release

      - name: Run checks
        if: matrix.node != '20.x' && matrix.prettier == 'lockfile'
        run: npm run check

      - name: Run latest Prettier checks
        if: matrix.prettier == 'latest-3'
        run: npm run check:prettier-latest

      - name: Check package dry run
        if: matrix.node != '20.x' || matrix.prettier != 'lockfile'
        run: npm run pack:check
